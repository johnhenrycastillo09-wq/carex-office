<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Carex Engineering Services — Staff Portal</title>
<style>
  :root{--primary:#1a6bb5;--primary-dark:#0a2f52;--success:#16a34a;--danger:#dc2626;--warning:#d97706;--orange:#f97316;--gray50:#f8fafc;--gray100:#f1f5f9;--gray200:#e2e8f0;--gray400:#94a3b8;--gray500:#64748b;--gray600:#475569;--text:#1e293b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;color:var(--text);min-height:100vh;}

  /* LOGIN */
  #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0a2f52 0%,#1a6bb5 100%);}
  .login-card{background:#fff;border-radius:16px;padding:2.5rem;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
  .login-logo{text-align:center;margin-bottom:1.5rem;}
  .login-logo .logo-badge{width:60px;height:60px;background:linear-gradient(135deg,#f97316,#fbbf24);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:900;color:#fff;margin-bottom:0.75rem;}
  .login-logo h1{font-size:1.1rem;font-weight:800;color:var(--primary-dark);}
  .login-logo p{font-size:0.75rem;color:var(--gray500);margin-top:0.2rem;}
  .login-field{margin-bottom:1rem;}
  .login-field label{display:block;font-size:0.78rem;font-weight:700;color:var(--gray600);margin-bottom:0.3rem;}
  .login-field input{width:100%;padding:0.6rem 0.9rem;border:1.5px solid var(--gray200);border-radius:8px;font-size:0.88rem;font-family:inherit;outline:none;transition:border 0.2s;}
  .login-field input:focus{border-color:var(--primary);}
  .login-btn{width:100%;padding:0.7rem;background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;border:none;border-radius:8px;font-size:0.9rem;font-weight:800;cursor:pointer;margin-top:0.5rem;}
  .login-btn:hover{opacity:0.9;}
  .login-error{color:var(--danger);font-size:0.78rem;text-align:center;margin-top:0.5rem;display:none;}

  /* APP */
  #appScreen{display:none;min-height:100vh;}
  .app-header{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;padding:0.75rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .app-header-left{display:flex;align-items:center;gap:0.75rem;}
  .header-logo{width:36px;height:36px;background:linear-gradient(135deg,#f97316,#fbbf24);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.85rem;color:#fff;}
  .header-title{font-size:0.95rem;font-weight:800;}
  .header-sub{font-size:0.68rem;opacity:0.8;}
  .header-right{display:flex;align-items:center;gap:0.75rem;font-size:0.78rem;}
  .staff-badge{background:rgba(255,255,255,0.2);padding:0.2rem 0.6rem;border-radius:20px;font-size:0.7rem;font-weight:700;}
  .logout-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:0.3rem 0.7rem;border-radius:6px;cursor:pointer;font-size:0.75rem;font-weight:700;}

  /* NAV TABS */
  .nav-tabs{background:#fff;border-bottom:2px solid var(--gray200);display:flex;overflow-x:auto;padding:0 1rem;}
  .nav-tab{padding:0.75rem 1rem;font-size:0.82rem;font-weight:700;color:var(--gray500);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;transition:all 0.2s;}
  .nav-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
  .nav-tab:hover{color:var(--primary);}

  /* CONTENT */
  .content{padding:1.25rem;max-width:1100px;margin:0 auto;}
  .page{display:none;}
  .page.active{display:block;}

  /* CARDS */
  .card{background:#fff;border-radius:12px;border:1.5px solid var(--gray200);padding:1.25rem;margin-bottom:1rem;box-shadow:0 1px 4px rgba(0,0,0,0.05);}
  .card-title{font-size:0.88rem;font-weight:800;color:var(--primary-dark);margin-bottom:0.75rem;display:flex;align-items:center;gap:0.4rem;}
  .section-title{font-size:1rem;font-weight:800;color:var(--primary-dark);margin-bottom:0.75rem;}

  /* PROJECT CARDS */
  .project-card{background:#fff;border:1.5px solid var(--gray200);border-radius:10px;padding:1rem;margin-bottom:0.75rem;cursor:pointer;transition:all 0.2s;}
  .project-card:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(26,107,181,0.1);}
  .project-card.expanded{border-color:var(--primary);background:#f8fbff;}
  .project-name{font-weight:800;font-size:0.9rem;color:var(--primary-dark);}
  .project-meta{font-size:0.75rem;color:var(--gray500);margin-top:0.2rem;}
  .project-detail{display:none;margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid var(--gray200);}
  .project-card.expanded .project-detail{display:block;}

  /* BADGES */
  .badge{display:inline-block;padding:0.15rem 0.5rem;border-radius:20px;font-size:0.65rem;font-weight:800;text-transform:uppercase;}
  .badge-active{background:#dbeafe;color:#1d4ed8;}
  .badge-completed{background:#dcfce7;color:#15803d;}
  .badge-pending{background:#fef9c3;color:#92400e;}

  /* WORKFLOW STEPS */
  .step-list{list-style:none;}
  .step-item{display:flex;align-items:flex-start;gap:0.6rem;padding:0.5rem 0;border-bottom:1px solid var(--gray100);}
  .step-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;flex-shrink:0;margin-top:0.1rem;}
  .step-done{background:#dcfce7;color:#15803d;}
  .step-pending{background:#f1f5f9;color:var(--gray400);}
  .step-text{font-size:0.8rem;color:var(--text);}
  .step-status{font-size:0.68rem;color:var(--gray400);}

  /* PROGRESS BAR */
  .progress-bar{background:var(--gray200);border-radius:10px;height:8px;overflow:hidden;margin:0.4rem 0;}
  .progress-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--primary),#38bdf8);transition:width 0.3s;}

  /* EMPTY STATE */
  .empty-state{text-align:center;padding:3rem 1rem;color:var(--gray400);}
  .empty-icon{font-size:2.5rem;margin-bottom:0.75rem;}
  .empty-title{font-size:0.9rem;font-weight:700;}

  /* TICKET */
  .ticket-item{background:#fff;border:1.5px solid var(--gray200);border-radius:10px;padding:0.85rem 1rem;margin-bottom:0.6rem;}
  .ticket-id{font-size:0.68rem;color:var(--gray400);font-weight:700;}
  .ticket-title{font-weight:800;font-size:0.88rem;margin:0.2rem 0;}
  .ticket-meta{font-size:0.72rem;color:var(--gray500);}

  /* SCHEDULE */
  .sched-item{background:#f0f9ff;border:1.5px solid #bae6fd;border-radius:8px;padding:0.75rem;margin-bottom:0.5rem;}
  .sched-date{font-size:0.78rem;font-weight:800;color:var(--primary);}
  .sched-detail{font-size:0.75rem;color:var(--gray600);margin-top:0.2rem;}

  /* RESPONSIVE */
  @media(max-width:600px){.content{padding:0.75rem;}.card{padding:0.9rem;}}
</style>
</head>
<body>
<!-- LOGIN SCREEN -->
<div id="loginScreen">
<div class="login-card">
<div class="login-logo">
<div class="logo-badge">CES</div>
<h1>Carex Engineering Services</h1>
<p>Staff Portal — Authorized Access Only</p>
</div>
<div class="login-field">
<label>Username</label>
<input autocomplete="username" id="staffUsername" placeholder="Enter your username" type="text"/>
</div>
<div class="login-field">
<label>Password</label>
<input autocomplete="current-password" id="staffPassword" placeholder="Enter your password" type="password"/>
</div>
<button class="login-btn" onclick="staffLogin()">Login</button>
<div class="login-error" id="loginError">Invalid username or password.</div>
</div>
</div>
<!-- APP SCREEN -->
<div id="appScreen">
<div class="app-header">
<div class="app-header-left">
<div class="header-logo">CES</div>
<div>
<div class="header-title">Carex Engineering Services</div>
<div class="header-sub">Staff Portal</div>
</div>
</div>
<div class="header-right">
<span class="staff-badge" id="staffNameDisplay">Staff</span>
<span class="staff-badge" id="staffRoleDisplay">Field</span>
<button class="logout-btn" onclick="staffLogout()">Logout</button>
</div>
</div>
<div class="nav-tabs" id="staffNavTabs"></div>
<div class="content">
<!-- DASHBOARD PAGE -->
<div class="page active" id="spage-dashboard">
<div class="section-title">👋 Welcome, <span id="welcomeName">Staff</span></div>
<div id="staffStatCards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0.75rem;margin-bottom:1.25rem;"></div>
<div class="card">
<div class="card-title">📅 Upcoming Schedules</div>
<div id="staffUpcomingSchedules"></div>
</div>
<div class="card">
<div class="card-title">📋 My Active Projects</div>
<div id="staffActiveProjects"></div>
</div>
</div>
<!-- PROJECTS PAGE -->
<div class="page" id="spage-projects">
<div class="section-title">📋 My Projects</div>
<div id="staffProjectList"></div>
</div>
<!-- TICKETS PAGE -->
<div class="page" id="spage-tickets">
<div class="section-title">🎫 My Tickets / Jobs</div>
<div id="staffTicketList"></div>
</div>
<!-- CALENDAR PAGE -->
<div class="page" id="spage-calendar">
<div class="section-title">📅 My Schedule</div>
<div id="staffCalendarView"></div>
</div>
<!-- BILLING PAGE (Accounting role only) -->
<div class="page" id="spage-billing">
<div class="section-title">💰 Billing &amp; Quotations</div>
<div id="staffBillingList"></div>
</div>
</div>
</div>
<script>
const FB_API = 'AIzaSyBkfHCMSBAMkFpMGGe5q8PBbMDHBFnBnKA';
const FB_PROJECT = 'carex-office';
const FB_BASE = `https://firestore.googleapis.com/v1/projects/${FB_PROJECT}/databases/(default)/documents`;

let currentStaff = null;
let allWorkers = [];
let allProjects = [];
let allJobs = [];
let allBilling = [];
let allQuotations = [];

// ---- FIREBASE HELPERS ----
async function fbGet(collection){
  try{
    const r = await fetch(`${FB_BASE}/${collection}?key=${FB_API}`);
    const d = await r.json();
    if(!d.documents)return[];
    return d.documents.map(doc=>{
      const id=doc.name.split('/').pop();
      const fields=doc.fields||{};
      const obj={id};
      Object.keys(fields).forEach(k=>{
        const v=fields[k];
        if(v.stringValue!==undefined)obj[k]=v.stringValue;
        else if(v.integerValue!==undefined)obj[k]=Number(v.integerValue);
        else if(v.doubleValue!==undefined)obj[k]=Number(v.doubleValue);
        else if(v.booleanValue!==undefined)obj[k]=v.booleanValue;
        else if(v.arrayValue)obj[k]=(v.arrayValue.values||[]).map(av=>av.stringValue||av.integerValue||'');
        else if(v.mapValue)obj[k]=JSON.stringify(v.mapValue);
        else obj[k]='';
      });
      return obj;
    });
  }catch(e){return[];}
}

function fromLS(key){try{return JSON.parse(localStorage.getItem(key)||'[]');}catch{return[];}}

// ---- AUTH ----
async function staffLogin(){
  const username = document.getElementById('staffUsername').value.trim().toLowerCase();
  const password = document.getElementById('staffPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display='none';

  if(!username||!password){errEl.textContent='Please enter username and password.';errEl.style.display='block';return;}

  // Load workers from localStorage first, then Firebase
  let workers = fromLS('cesv2_workers');
  if(!workers.length){
    workers = await fbGet('ces_workers');
  }

  const staff = workers.find(w=>
    w.portalAccess==='yes' &&
    (w.username||'').toLowerCase()===username &&
    w.password===password
  );

  if(!staff){errEl.textContent='Invalid username or password.';errEl.style.display='block';return;}

  currentStaff = staff;
  localStorage.setItem('ces_staff_session', JSON.stringify({id:staff.id,name:staff.name,role:staff.portalRole,username:staff.username}));
  await initApp();
}

function staffLogout(){
  localStorage.removeItem('ces_staff_session');
  currentStaff=null;
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('appScreen').style.display='none';
}

async function checkSession(){
  const session = localStorage.getItem('ces_staff_session');
  if(!session)return;
  try{
    const s = JSON.parse(session);
    // Verify worker still has access
    let workers = fromLS('cesv2_workers');
    if(!workers.length) workers = await fbGet('ces_workers');
    const staff = workers.find(w=>w.id===s.id&&w.portalAccess==='yes');
    if(staff){currentStaff=staff;await initApp();}
    else localStorage.removeItem('ces_staff_session');
  }catch(e){localStorage.removeItem('ces_staff_session');}
}

// ---- INIT APP ----
async function initApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';

  document.getElementById('staffNameDisplay').textContent=currentStaff.name||'Staff';
  const roleLabels={field:'👷 Field',accounting:'📊 Accounting',office:'🏢 Office',admin:'👑 Admin'};
  document.getElementById('staffRoleDisplay').textContent=roleLabels[currentStaff.portalRole]||'Staff';
  document.getElementById('welcomeName').textContent=(currentStaff.name||'Staff').split(' ')[0];

  // Load data
  allWorkers = fromLS('cesv2_workers');
  allProjects = fromLS('cesv2_projects');
  allJobs = fromLS('cesv2_jobs');
  allBilling = fromLS('cesv2_billing');
  allQuotations = fromLS('cesv2_quotations');

  // Try Firebase if empty
  if(!allWorkers.length) allWorkers = await fbGet('ces_workers');
  if(!allProjects.length) allProjects = await fbGet('ces_projects');
  if(!allJobs.length) allJobs = await fbGet('ces_jobs');
  if(!allBilling.length) allBilling = await fbGet('ces_billing');

  buildNavTabs();
  renderDashboard();
}

// ---- NAV ----
function buildNavTabs(){
  const role = currentStaff.portalRole||'field';
  const tabs = [{id:'dashboard',label:'🏠 Dashboard',roles:['field','accounting','office','admin']}];
  if(['field','office','admin'].includes(role)) tabs.push({id:'projects',label:'📋 Projects',roles:['field','office','admin']});
  if(['field','office','admin'].includes(role)) tabs.push({id:'tickets',label:'🎫 Tickets',roles:['field','office','admin']});
  if(['field','office','admin'].includes(role)) tabs.push({id:'calendar',label:'📅 Schedule',roles:['field','office','admin']});
  if(['accounting','admin'].includes(role)) tabs.push({id:'billing',label:'💰 Billing',roles:['accounting','admin']});

  const navEl = document.getElementById('staffNavTabs');
  navEl.innerHTML = tabs.map((t,i)=>`<div class="nav-tab${i===0?' active':''}" onclick="showStaffPage('${t.id}',this)">${t.label}</div>`).join('');
}

function showStaffPage(pageId, navEl){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  const page = document.getElementById('spage-'+pageId);
  if(page) page.classList.add('active');
  if(navEl) navEl.classList.add('active');
  if(pageId==='projects') renderStaffProjects();
  if(pageId==='tickets') renderStaffTickets();
  if(pageId==='calendar') renderStaffCalendar();
  if(pageId==='billing') renderStaffBilling();
}

// ---- HELPERS ----
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(d){if(!d||d==='Invalid Date')return'--';try{const dt=new Date(d);if(isNaN(dt))return d;return dt.toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'});}catch{return d;}}
function fmtTime(t){if(!t)return'';try{const[h,m]=t.split(':');const hr=Number(h);return`${hr%12||12}:${m} ${hr>=12?'PM':'AM'}`;}catch{return t;}}

function getMyProjects(){
  return allProjects.filter(p=>{
    if(!p.assignees)return false;
    let assignees=p.assignees;
    if(typeof assignees==='string'){try{assignees=JSON.parse(assignees);}catch{return false;}}
    if(!Array.isArray(assignees))return false;
    return assignees.some(a=>(a.id||a)===currentStaff.id);
  });
}

function getMyJobs(){
  return allJobs.filter(j=>{
    if(!j.assignees)return false;
    let assignees=j.assignees;
    if(typeof assignees==='string'){try{assignees=JSON.parse(assignees);}catch{return false;}}
    if(!Array.isArray(assignees))return false;
    return assignees.some(a=>(a.id||a)===currentStaff.id);
  });
}

// ---- DASHBOARD ----
function renderDashboard(){
  const myProjects = getMyProjects();
  const myJobs = getMyJobs();
  const activeProjects = myProjects.filter(p=>p.status!=='completed');
  const openJobs = myJobs.filter(j=>j.progress!=='closed'&&j.progress!=='resolved');

  // Stat cards
  document.getElementById('staffStatCards').innerHTML=[
    {icon:'📋',label:'My Projects',val:myProjects.length,sub:activeProjects.length+' Active'},
    {icon:'🎫',label:'My Tickets',val:myJobs.length,sub:openJobs.length+' Open'},
    {icon:'✅',label:'Completed',val:myProjects.filter(p=>p.status==='completed').length,sub:'Projects'},
  ].map(s=>`<div style="background:#fff;border:1.5px solid var(--gray200);border-radius:10px;padding:0.9rem;text-align:center;">
    <div style="font-size:1.5rem;">${s.icon}</div>
    <div style="font-size:1.4rem;font-weight:900;color:var(--primary-dark);">${s.val}</div>
    <div style="font-size:0.72rem;font-weight:700;color:var(--gray600);">${s.label}</div>
    <div style="font-size:0.65rem;color:var(--gray400);">${s.sub}</div>
  </div>`).join('');

  // Upcoming schedules (next 7 days)
  const today = new Date(); today.setHours(0,0,0,0);
  const in7 = new Date(today); in7.setDate(today.getDate()+7);
  const schedEl = document.getElementById('staffUpcomingSchedules');
  const scheds = [];
  myProjects.forEach(p=>{
    if(p.schedulesByType){
      let sbt=p.schedulesByType;
      if(typeof sbt==='string'){try{sbt=JSON.parse(sbt);}catch{sbt={};}}
      Object.entries(sbt).forEach(([type,sched])=>{
        if(sched&&sched.startDate){
          const d=new Date(sched.startDate);
          if(d>=today&&d<=in7) scheds.push({name:p.name,type,date:sched.startDate,time:sched.startTime});
        }
      });
    } else if(p.startDate){
      const d=new Date(p.startDate);
      if(d>=today&&d<=in7) scheds.push({name:p.name,type:'',date:p.startDate,time:p.startTime});
    }
  });
  myJobs.forEach(j=>{
    if(j.schedDate){
      const d=new Date(j.schedDate);
      if(d>=today&&d<=in7) scheds.push({name:j.scope||'Job',type:'ticket',date:j.schedDate,time:j.schedTime});
    }
  });
  scheds.sort((a,b)=>new Date(a.date)-new Date(b.date));
  schedEl.innerHTML=scheds.length?scheds.map(s=>`<div class="sched-item">
    <div class="sched-date">📅 ${fmtDate(s.date)}${s.time?' at '+fmtTime(s.time):''}</div>
    <div class="sched-detail">${esc(s.name)}${s.type?' — '+s.type:''}</div>
  </div>`).join(''):'<div style="font-size:0.8rem;color:var(--gray400);padding:0.5rem;">No upcoming schedules in the next 7 days.</div>';

  // Active projects
  const apEl = document.getElementById('staffActiveProjects');
  apEl.innerHTML=activeProjects.length?activeProjects.slice(0,3).map(p=>`<div class="project-card" onclick="showStaffPage('projects',document.querySelector('.nav-tab:nth-child(2)'))">
    <div class="project-name">${esc(p.name)}</div>
    <div class="project-meta">${esc(p.location||'')} · ${(p.types||[p.type]).join(', ')}</div>
    <div class="progress-bar" style="margin-top:0.4rem;"><div class="progress-fill" style="width:${p.progress||0}%;"></div></div>
    <div style="font-size:0.68rem;color:var(--gray400);">${p.progress||0}% complete</div>
  </div>`).join(''):'<div style="font-size:0.8rem;color:var(--gray400);padding:0.5rem;">No active projects assigned to you.</div>';
}

// ---- PROJECTS ----
function renderStaffProjects(){
  const myProjects = getMyProjects();
  const el = document.getElementById('staffProjectList');
  if(!myProjects.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">No projects assigned to you yet.</div></div>';return;}
  const typeLabels={ducting:'Ducting Works',sprinkler:'Sprinkler System',airbalancing:'Air Balancing',fcuinstall:'FCU Installation',fcudismantling:'FCU Dismantling'};
  el.innerHTML=myProjects.map(p=>{
    const types=(p.types||[p.type]).filter(Boolean);
    const statusBadge=p.status==='completed'?'badge-completed':p.status==='active'?'badge-active':'badge-pending';
    return`<div class="project-card" onclick="this.classList.toggle('expanded')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div class="project-name">${esc(p.name)}</div>
          <div class="project-meta">📍 ${esc(p.location||'--')} · 🏢 ${esc(p.clientName||p.client||'--')}</div>
          <div style="margin-top:0.3rem;display:flex;gap:0.3rem;flex-wrap:wrap;">
            ${types.map(t=>`<span class="badge badge-active">${typeLabels[t]||t}</span>`).join('')}
          </div>
        </div>
        <span class="badge ${statusBadge}">${p.status||'pending'}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${p.progress||0}%;"></div></div>
      <div style="font-size:0.68rem;color:var(--gray400);">${p.progress||0}% complete</div>
      <div class="project-detail">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;font-size:0.78rem;margin-bottom:0.75rem;">
          <div><span style="color:var(--gray500);">Start Date:</span> <strong>${fmtDate(p.startDate)}</strong></div>
          <div><span style="color:var(--gray500);">Target End:</span> <strong>${fmtDate(p.targetEndDate||p.endDate)}</strong></div>
          ${p.notes?`<div style="grid-column:1/-1;"><span style="color:var(--gray500);">Notes:</span> ${esc(p.notes)}</div>`:''}
        </div>
        ${renderWorkflowSteps(p)}
      </div>
    </div>`;
  }).join('');
}

function renderWorkflowSteps(p){
  const types=(p.types||[p.type]).filter(Boolean);
  if(!types.length)return'';
  const stepsByType={
    ducting:['PTW','Toolbox Talk','Shop Drawings','Fabrication','Hanger Installation','Duct Installation','Duct Leakage Test','Insulation','Air Balancing','As-Built Plan','Consultant Inspection'],
    sprinkler:['PTW','Toolbox Talk','Shop Drawings','Dismantling','Installation','Hydrotesting','As-Built Plan','Consultant Inspection'],
    airbalancing:['Preliminary Steps','Initial Measurements','Adjusting Airflow','Balancing','Verification','Final Adjustments'],
    fcuinstall:['PTW','Toolbox Talk','Material Delivery','Site Preparation','Bracket Installation','FCU Mounting','Chilled Water Piping','Electrical Wiring','Drain Line','Insulation','Chemical Flushing','Testing & Commissioning','Consultant Inspection'],
    fcudismantling:['PTW','Toolbox Talk','Dismantling','Post-Work','Consultant Inspection']
  };
  return types.map(type=>{
    const steps=stepsByType[type]||[];
    const workflow=p.workflow||{};
    let wf=workflow[type]||{};
    if(typeof wf==='string'){try{wf=JSON.parse(wf);}catch{wf={};}}
    return`<div style="margin-bottom:0.75rem;">
      <div style="font-size:0.75rem;font-weight:800;color:var(--primary);margin-bottom:0.4rem;">${{ducting:'Ducting',sprinkler:'Sprinkler',airbalancing:'Air Balancing',fcuinstall:'FCU Install',fcudismantling:'FCU Dismantling'}[type]||type} Workflow</div>
      <ul class="step-list">${steps.map(step=>{
        const key=step.toLowerCase().replace(/[^a-z]/g,'');
        const done=wf[key]||wf[step]||false;
        return`<li class="step-item">
          <div class="step-icon ${done?'step-done':'step-pending'}">${done?'✓':'○'}</div>
          <div><div class="step-text">${esc(step)}</div></div>
        </li>`;
      }).join('')}</ul>
    </div>`;
  }).join('');
}

  if(!myJobs.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">🎫</div><div class="empty-title">No tickets assigned to you yet.</div></div>';return;}
  const statusColor={open:'#dbeafe',resolved:'#dcfce7',closed:'#f1f5f9','in-progress':'#fef9c3'};
  el.innerHTML=myJobs.map(j=>`<div class="ticket-item">
    <div class="ticket-id">${esc(j.ticketNo||j.id)}</div>
    <div class="ticket-title">${esc(j.scope||j.title||'Job')}</div>
    <div class="ticket-meta">📍 ${esc(j.location||'--')} · 🏪 ${esc(j.merchant||'--')}</div>
    ${j.schedDate?`<div style="font-size:0.72rem;color:var(--primary);margin-top:0.3rem;">📅 Scheduled: ${fmtDate(j.schedDate)}${j.schedTime?' at '+fmtTime(j.schedTime):''}</div>`:''}
    <div style="margin-top:0.4rem;display:flex;align-items:center;gap:0.5rem;">
      <span class="badge" style="background:${statusColor[j.progress]||'#f1f5f9'};color:var(--text);">${j.progress||'open'}</span>

    </div>
    ${j.fieldIssues?`<div style="font-size:0.72rem;color:var(--gray500);margin-top:0.4rem;padding:0.4rem;background:var(--gray50);border-radius:6px;">${esc(j.fieldIssues.slice(0,100))}${j.fieldIssues.length>100?'...':''}</div>`:''}
  </div>`).join('');
}

// ---- CALENDAR ----
function renderStaffCalendar(){
  const el = document.getElementById('staffCalendarView');
  const myProjects = getMyProjects();
  const myJobs = getMyJobs();
  const today = new Date(); today.setHours(0,0,0,0);

  // Build events for next 30 days
  const events = [];
  myProjects.forEach(p=>{
    if(p.schedulesByType){
      let sbt=p.schedulesByType;
      if(typeof sbt==='string'){try{sbt=JSON.parse(sbt);}catch{sbt={};}}
      Object.entries(sbt).forEach(([type,sched])=>{
        if(sched&&sched.startDate) events.push({date:sched.startDate,time:sched.startTime,label:p.name,sub:type,color:'#dbeafe'});
      });
    } else if(p.startDate){
      events.push({date:p.startDate,time:p.startTime,label:p.name,sub:'project',color:'#dbeafe'});
    }
  });
  myJobs.forEach(j=>{
    if(j.schedDate) events.push({date:j.schedDate,time:j.schedTime,label:j.scope||'Job',sub:j.merchant||'',color:'#fef9c3'});
  });
  events.sort((a,b)=>new Date(a.date)-new Date(b.date));

  if(!events.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-title">No scheduled events found.</div></div>';return;}

  // Group by month
  const grouped={};
  events.forEach(e=>{
    const d=new Date(e.date);
    const key=d.toLocaleDateString('en-PH',{month:'long',year:'numeric'});
    if(!grouped[key])grouped[key]=[];
    grouped[key].push(e);
  });

  el.innerHTML=Object.entries(grouped).map(([month,evts])=>`
    <div style="margin-bottom:1.25rem;">
      <div style="font-size:0.82rem;font-weight:800;color:var(--primary-dark);margin-bottom:0.5rem;padding-bottom:0.3rem;border-bottom:2px solid var(--primary);">${month}</div>
      ${evts.map(e=>`<div class="sched-item" style="background:${e.color};">
        <div class="sched-date">📅 ${fmtDate(e.date)}${e.time?' at '+fmtTime(e.time):''}</div>
        <div class="sched-detail"><strong>${esc(e.label)}</strong>${e.sub?' — '+esc(e.sub):''}</div>
      </div>`).join('')}
    </div>`).join('');
}

// ---- BILLING (Accounting only) ----
function renderStaffBilling(){
  const el = document.getElementById('staffBillingList');
  if(!allBilling.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">💰</div><div class="empty-title">No billing records found.</div></div>';return;}
  const statusColor={draft:'var(--gray400)',sent:'var(--primary)',approved:'var(--warning)',invoiced:'var(--orange)',paid:'var(--success)'};
  el.innerHTML=allBilling.map(b=>{
    const totalRec=(b.dpReceivedDate?Number(b.dpAmt||0):0)+(b.fcuReceivedDate?Number(b.fcuAmt||0):0)+(b.finalReceivedDate?Number(b.finalAmt||0):0);
    const outstanding=Math.max(0,Number(b.total||0)-totalRec);
    return`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div style="font-weight:800;font-size:0.88rem;">${esc(b.title)}</div>
          <div style="font-size:0.72rem;color:var(--gray500);">${esc(b.clientName||'')} · ${fmtDate(b.date)}</div>
        </div>
        <span class="badge" style="background:${statusColor[b.status]||'var(--gray400)'};color:#fff;">${b.status||'draft'}</span>
      </div>
      <div style="display:flex;gap:1rem;margin-top:0.5rem;font-size:0.78rem;flex-wrap:wrap;">
        <span style="color:var(--primary);font-weight:700;">Total: PHP ${Number(b.total||0).toLocaleString('en-PH',{minimumFractionDigits:2})}</span>
        <span style="color:var(--success);font-weight:700;">Received: PHP ${totalRec.toLocaleString('en-PH',{minimumFractionDigits:2})}</span>
        ${outstanding>0?`<span style="color:var(--danger);font-weight:700;">Outstanding: PHP ${outstanding.toLocaleString('en-PH',{minimumFractionDigits:2})}</span>`:'<span style="color:var(--success);">✅ Fully Paid</span>'}
      </div>
      ${b.retentionPct>0?`<div style="font-size:0.72rem;color:var(--warning);margin-top:0.3rem;">⏳ Retention ${b.retentionPct}% — Release: ${fmtDate(b.retentionRelease)}</div>`:''}
    </div>`;
  }).join('');
}
